name: Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    name: Unit, UAT, and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: node --check app.js && node --check inference.js
      - name: Run browser unit and UAT coverage
        run: node scripts/run-browser-uat.mjs
      - name: Verify SonarQube input reports
        run: |
          test -s build/reports/browser-uat/lcov.info
          test -s build/reports/browser-uat/sonar-test-execution.xml
      - name: Require SonarQube Cloud token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing SONAR_TOKEN repository secret; coverage cannot be published."
            exit 1
          fi
      - name: Run SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-reports
          path: build/reports/browser-uat/
          if-no-files-found: error
  deploy:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: config
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo configured=true >>"$GITHUB_OUTPUT"; echo "project=${PROJECT:-boltzmann-machine-lab}" >>"$GITHUB_OUTPUT"; else echo configured=false >>"$GITHUB_OUTPUT"; fi
      - if: steps.config.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ steps.config.outputs.project }}
